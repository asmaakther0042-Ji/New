name: Flutter Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Flutter project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/settings.gradle
          echo "Flutter project files found."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Configure Android local.properties
        run: |
          mkdir -p android
          printf "sdk.dir=%s\nflutter.sdk=%s\n" "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          cat android/local.properties

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: city-rush-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
